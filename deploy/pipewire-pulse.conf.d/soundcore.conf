# Extra Pulse socket for the soundcore system user.
# The session user (default sensepart) owns PipeWire. This socket lives
# outside /run/user so a service account can open it without joining that
# home directory. Group soundcore-audio and mode 0660 are applied by
# soundcore-pulse-access.service.
pulse.properties = {
    server.address = [
        "unix:native"
        "unix:/run/soundcore/pulse.sock"
    ]
}
